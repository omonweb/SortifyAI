services:

  postgres:
    image: postgres:17
    container_name: sortify-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: sortify_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8
    container_name: sortify-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

  minio:
    image: minio/minio
    container_name: sortify-minio
    restart: unless-stopped

    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123

    ports:
      - "9000:9000"
      - "9001:9001"

    command: server /data --console-address ":9001"

    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data: